name: CI

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set up pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local CI pipeline
        run: pnpm validate

      - name: Verify committed dist bundle is up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- dist/index.js; then
            echo "::error::dist/index.js is out of date. Run 'pnpm build' and commit the updated bundle."
            exit 1
          fi
